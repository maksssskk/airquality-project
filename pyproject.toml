[project]
name = "monitor-powietrza"
version = "0.1.0"
description = "Aplikacja dla monitoringu jakości powietrza, stworzona z wykorzystaniem Pythona, SQLAlchemy, Flask"
readme = "README.md"
authors = [
    { name = "Maks K", email = "ma.kot@wspa.edu.pl" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
monitor-powietrza = "monitor_powietrza:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]
